name: Development validation

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-development-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: omega_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omega_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            vite-version/package-lock.json
            .github/workflows/development-validation.yml

      - name: Use npm 11.6.0 for stable peer resolution
        run: npm install --global npm@11.6.0
      - name: Build API
        working-directory: api
        run: |
          npm ci || {
            status=$?
            echo "npm ci failed; recent npm debug log follows:"
            log_file=$(ls -t "$HOME"/.npm/_logs/*debug-0.log 2>/dev/null | head -n 1)
            if [ -n "$log_file" ]; then tail -n 120 "$log_file"; fi
            exit "$status"
          }
          npm run build

      - name: Run purchase-order approval regression tests
        working-directory: api
        run: npx vitest run src/approvals/approvals.service.spec.ts

      - name: Test API
        working-directory: api
        env:
          MFA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/omega_ci_test
        run: npm test

      - name: Report API dependency audit findings
        working-directory: api
        run: |
          npm audit --json > "$RUNNER_TEMP/api-audit.json" || true
          node -e "const a=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities,vulnerabilities:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range})}))},null,2))" "$RUNNER_TEMP/api-audit.json"

      - name: Lint API
        working-directory: api
        run: npm run lint

      - name: Build frontend
        working-directory: vite-version
        run: |
          npm ci || {
            status=$?
            echo "npm ci failed; recent npm debug log follows:"
            log_file=$(ls -t "$HOME"/.npm/_logs/*debug-0.log 2>/dev/null | head -n 1)
            if [ -n "$log_file" ]; then tail -n 120 "$log_file"; fi
            exit "$status"
          }
          npm run build

      - name: Lint frontend
        working-directory: vite-version
        run: npm run lint

      - name: Report frontend dependency audit findings
        working-directory: vite-version
        run: |
          npm audit --json > "$RUNNER_TEMP/frontend-audit.json" || true
          node -e "const a=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities,vulnerabilities:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range})}))},null,2))" "$RUNNER_TEMP/frontend-audit.json"
