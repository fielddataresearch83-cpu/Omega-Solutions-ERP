name: Development validation

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-development-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: omega_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omega_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            vite-version/package-lock.json
            .github/workflows/development-validation.yml

      - name: Use npm 11.6.0 for stable peer resolution
        run: npm install --global npm@11.6.0
      - name: Build API
        working-directory: api
        run: |
          npm ci || {
            status=$?
            echo "npm ci failed; recent npm debug log follows:"
            log_file=$(ls -t "$HOME"/.npm/_logs/*debug-0.log 2>/dev/null | head -n 1)
            if [ -n "$log_file" ]; then tail -n 120 "$log_file"; fi
            exit "$status"
          }
          npm run build

      - name: Run purchase-order approval regression tests
        working-directory: api
        run: npx vitest run src/approvals/approvals.service.spec.ts

      - name: Test API
        working-directory: api
        env:
          MFA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/omega_ci_test
        run: npm test

      # The cross-company suite runs the real application against the migrated schema.
      # This only ever touches the disposable CI service container, never a shared database.
      - name: Apply migrations to disposable CI database
        working-directory: api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/omega_ci_test
        run: npm run migrate

      # Keeps docs/DEVELOPMENT_SCHEMA_FORWARD_REPAIR.sql honest: installs migrations on a
      # throwaway database, simulates the documented drift, then proves the bundle repairs it,
      # is idempotent, and fails closed on duplicate supplier invoice references.
      - name: Rehearse schema forward-repair bundle in isolation
        working-directory: api
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/omega_ci_test
        run: |
          node scripts/create-disposable-database.mjs omega_forward_repair_test
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/omega_forward_repair_test \
            node scripts/rehearse-schema-forward-repair.mjs

      - name: Create disposable application-RLS database
        working-directory: api
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/omega_ci_test
        run: node scripts/create-disposable-database.mjs omega_app_rls_test

      # Cross-company/role tests need the full migrated schema, so they run before the
      # application-RLS suite, which fabricates and drops public.company_memberships.
      - name: Verify tenant isolation and role boundaries
        working-directory: api
        env:
          OMEGA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/omega_ci_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/omega_ci_test
        run: |
          npm run test:e2e -- test/tenant-cross-company.e2e-spec.ts test/tenant-rls.e2e-spec.ts \
            --no-file-parallelism --reporter=json --outputFile="$RUNNER_TEMP/tenant-isolation.json"
          node -e "
            const r = require(process.env.RUNNER_TEMP + '/tenant-isolation.json');
            console.log('tenant isolation: passed=' + r.numPassedTests + ' total=' + r.numTotalTests + ' skipped=' + r.numPendingTests + ' failed=' + r.numFailedTests);
            if (r.numFailedTests > 0) process.exit(1);
            if (r.numPendingTests !== 0) { console.error('Tenant isolation tests were skipped; they must execute against PostgreSQL.'); process.exit(1); }
            if (r.numPassedTests < 12) { console.error('Expected at least 12 executed tenant isolation tests (9 cross-company + 3 RLS).'); process.exit(1); }
          "

      - name: Verify company RLS policy migration
        working-directory: api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/omega_app_rls_test
        run: |
          npm run test:e2e -- test/application-rls.e2e-spec.ts \
            --no-file-parallelism --reporter=json --outputFile="$RUNNER_TEMP/application-rls.json"
          node -e "
            const r = require(process.env.RUNNER_TEMP + '/application-rls.json');
            console.log('application RLS: passed=' + r.numPassedTests + ' total=' + r.numTotalTests + ' skipped=' + r.numPendingTests + ' failed=' + r.numFailedTests);
            if (r.numFailedTests > 0) process.exit(1);
            if (r.numPendingTests !== 0) { console.error('Application RLS tests were skipped; they must execute against PostgreSQL.'); process.exit(1); }
            if (r.numPassedTests < 4) { console.error('Expected at least 4 executed application RLS policy tests.'); process.exit(1); }
          "

      - name: Report API dependency audit findings
        working-directory: api
        run: |
          npm audit --json > "$RUNNER_TEMP/api-audit.json" || true
          node -e "const a=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities,vulnerabilities:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range})}))},null,2))" "$RUNNER_TEMP/api-audit.json"

      - name: Lint API
        working-directory: api
        run: npm run lint

      - name: Build frontend
        working-directory: vite-version
        run: |
          npm ci || {
            status=$?
            echo "npm ci failed; recent npm debug log follows:"
            log_file=$(ls -t "$HOME"/.npm/_logs/*debug-0.log 2>/dev/null | head -n 1)
            if [ -n "$log_file" ]; then tail -n 120 "$log_file"; fi
            exit "$status"
          }
          npm run build

      - name: Lint frontend
        working-directory: vite-version
        run: npm run lint

      - name: Report frontend dependency audit findings
        working-directory: vite-version
        run: |
          npm audit --json > "$RUNNER_TEMP/frontend-audit.json" || true
          node -e "const a=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities,vulnerabilities:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range})}))},null,2))" "$RUNNER_TEMP/frontend-audit.json"
