name: Refresh API lockfile

on:
  push:
    branches:
      - development
    paths:
      - ".github/workflows/refresh-api-lockfile.yml"

permissions:
  contents: write

jobs:
  refresh-api-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Use npm with the Arborist peer-resolution fix
        run: npm install --global npm@11.6.0
      - name: Regenerate API lockfile from the manifest
        working-directory: api
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean lockfile installation
        working-directory: api
        run: npm ci
      - name: Commit the corrected lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/package-lock.json
          if git diff --cached --quiet; then
            echo "API lockfile already matches package.json."
          else
            git commit -m "chore(deps): refresh API lockfile"
            git push origin HEAD:development
          fi
