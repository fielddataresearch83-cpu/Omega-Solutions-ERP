name: Manual development tenant isolation smoke (creates auth sessions)

on:
  workflow_dispatch:
    inputs:
      acknowledge_auth_session_creation:
        description: "I understand sign-in and token exchange create development authentication session records."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tenant-isolation:
    if: ${{ inputs.acknowledge_auth_session_creation == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout existing development branch
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify business-data isolation (authentication sessions are created)
        env:
          OMEGA_API_URL: https://omega-solutions-api-development.onrender.com/api
          OMEGA_SECURITY_TEST_A_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_A_EMAIL }}
          OMEGA_SECURITY_TEST_A_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_A_PASSWORD }}
          OMEGA_SECURITY_TEST_B_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_B_EMAIL }}
          OMEGA_SECURITY_TEST_B_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_B_PASSWORD }}
        run: node api/scripts/live-auth-tenant-readonly-smoke.mjs
