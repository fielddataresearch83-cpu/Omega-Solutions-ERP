name: Project calendar event reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: omega-project-event-reminders-development
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      OMEGA_API_URL: ${{ vars.OMEGA_DEVELOPMENT_API_URL }}
    steps:
      - name: Dispatch development project event reminders using GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const api = new URL(process.env.OMEGA_API_URL ?? '');
          if (
            api.protocol !== 'https:' ||
            api.hostname !== 'omega-solutions-erp-9k9s-git-development-coll5.vercel.app' ||
            api.pathname !== '/api' ||
            api.username || api.password || api.search || api.hash
          ) {
            throw new Error('Refusing an unapproved target. OMEGA_DEVELOPMENT_API_URL must point to the exact Development API deployment URL ending in /api.');
          }

          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set('audience', 'omega-erp-reminders');
          const tokenResponse = await fetch(tokenUrl, {
            headers: {
              Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`,
            },
          });
          if (!tokenResponse.ok) {
            throw new Error(`GitHub OIDC token request failed with HTTP ${tokenResponse.status}.`);
          }
          const { value: identityToken } = await tokenResponse.json();
          if (typeof identityToken !== 'string' || !identityToken) {
            throw new Error('GitHub did not return an OIDC identity token.');
          }

          const endpoint = `${api.origin}${api.pathname}/internal/project-event-reminders/dispatch`;
          console.log('Development project event reminder endpoint:', endpoint);
          for (let attempt = 1; attempt <= 3; attempt += 1) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { Authorization: `Bearer ${identityToken}` },
            });
            const body = await response.text();
            if (response.ok) {
              console.log(body);
              process.exit(0);
            }
            if (response.status < 500 || attempt === 3) {
              throw new Error(`Project event reminder dispatch failed with HTTP ${response.status}: ${body}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          NODE
