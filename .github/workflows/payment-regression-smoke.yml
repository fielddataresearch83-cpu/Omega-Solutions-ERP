name: Payment regression smoke test

on:
  # This smoke test creates persistent invoices, payments, supplier bills and POS records.
  # Run manually only when its data impact and cleanup plan have been reviewed.
  workflow_dispatch:
    inputs:
      acknowledge_isolated_test_database:
        description: "I confirm the isolated-test API is connected to a disposable database, not shared Development or Production."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: payment-regression-development
  cancel-in-progress: false

jobs:
  payment-regression:
    if: ${{ inputs.acknowledge_isolated_test_database == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMEGA_LIVE_SMOKE_CONFIRM_ISOLATED_TEST_DATABASE: YES
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify required test credentials are configured
        env:
          OMEGA_SECURITY_TEST_A_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_A_EMAIL }}
          OMEGA_SECURITY_TEST_A_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_A_PASSWORD }}
          OMEGA_SECURITY_TEST_B_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_B_EMAIL }}
          OMEGA_SECURITY_TEST_B_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_B_PASSWORD }}
        run: |
          missing=0
          for name in OMEGA_SECURITY_TEST_A_EMAIL OMEGA_SECURITY_TEST_A_PASSWORD OMEGA_SECURITY_TEST_B_EMAIL OMEGA_SECURITY_TEST_B_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret $name is not configured."
              missing=1
            fi
          done
          exit "$missing"
      - name: Validate explicit development API target
        env:
          # Use the explicitly configured development API URL; there is no fallback target.
          OMEGA_API_URL: ${{ vars.OMEGA_ISOLATED_TEST_API_URL }}
        run: |
          node --input-type=module -e 'const value=process.env.OMEGA_API_URL; if (!value) throw new Error("OMEGA_ISOLATED_TEST_API_URL repository variable is required; refusing to run."); const url=new URL(value); if (url.protocol !== "https:" || !url.hostname.endsWith("-coll5.vercel.app") || ["omega-solutions-erp-9k9s.vercel.app", "omega-solutions-erp-9k9s-coll5.vercel.app"].includes(url.hostname) || !url.pathname.replace(/\/$/, "").endsWith("/api")) throw new Error("API target must be an isolated Vercel Preview deployment ending in /api."); console.log("Isolated test API target configured:", url.origin + url.pathname);'

      - name: Run authenticated payment regression against development API
        env:
          OMEGA_API_URL: ${{ vars.OMEGA_ISOLATED_TEST_API_URL }}
          OMEGA_SECURITY_TEST_A_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_A_EMAIL }}
          OMEGA_SECURITY_TEST_A_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_A_PASSWORD }}
          OMEGA_SECURITY_TEST_B_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_B_EMAIL }}
          OMEGA_SECURITY_TEST_B_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_B_PASSWORD }}
        run: node api/scripts/live-payment-regression-smoke.mjs
