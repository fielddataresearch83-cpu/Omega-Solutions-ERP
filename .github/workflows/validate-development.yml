name: Validate Omega development

on:
  push:
    branches:
      - development
    paths:
      - "api/**"
      - "vite-version/**"
      - ".github/workflows/validate-development.yml"
  pull_request:
    paths:
      - "api/**"
      - "vite-version/**"
      - ".github/workflows/validate-development.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: omega_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omega_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            vite-version/package-lock.json
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Build API
        working-directory: api
        run: npm run build
      - name: Run API tests
        working-directory: api
        env:
          MFA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/omega_test
        run: npm test
      - name: Smoke-test deployed API health and database
        run: |
          curl --fail --silent --show-error --connect-timeout 5 --max-time 10 --retry 3 --retry-all-errors --retry-delay 3 \
            https://omega-solutions-api-development.onrender.com/api/health \
            --output /tmp/omega-api-health.json
          cat /tmp/omega-api-health.json
          node -e "const h=require('/tmp/omega-api-health.json'); if (h.status !== 'ok' || h.database !== 'connected') { console.error('API health check failed'); process.exit(1); }"

      - name: Install frontend dependencies
        working-directory: vite-version
        run: npm ci
      - name: Build frontend
        working-directory: vite-version
        run: npm run build

  migration-smoke:
    name: Clean PostgreSQL migration and idempotency smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: omega_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omega_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Verify mixed migration naming sorts by intended version
        working-directory: api
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; import { compareMigrationNames, findMigrationLedgerGaps } from './scripts/migration-order.mjs'; assert.ok(compareMigrationNames('009_invoice_number_sequences.sql', '20261014190000_010_quotations.sql') < 0); assert.ok(compareMigrationNames('20261014190000_010_quotations.sql', '20261014190100_011_sales_orders.sql') < 0); assert.ok(compareMigrationNames('20261014190100_011_sales_orders.sql', '012_crm_full_suite.sql') < 0); assert.ok(compareMigrationNames('024_workforce_foundation.sql', '024_workforce_attendance_assignments.sql') < 0); assert.ok(compareMigrationNames('20261018000000_product_image_storage.sql', '2026101801_add_product_image_columns.sql') < 0); assert.deepEqual(findMigrationLedgerGaps(['001_a.sql','002_b.sql','003_c.sql'], ['001_a.sql','003_c.sql']), ['002_b.sql']); assert.deepEqual(findMigrationLedgerGaps(['001_a.sql','002_b.sql'], ['001_a.sql']), []); assert.deepEqual(findMigrationLedgerGaps(['001_a.sql','002_b.sql'], []), []);"
      - name: Apply all migrations to a clean disposable database
        working-directory: api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/omega_migration_test
        run: npm run migrate
      - name: Assert canonical workforce schema after clean install
        working-directory: api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/omega_migration_test
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const columns = await client.query(`
              SELECT table_name, column_name, data_type, character_maximum_length, column_default
              FROM information_schema.columns
              WHERE table_schema='public'
                AND (table_name, column_name) IN (
                  ('client_sites','client_name'),
                  ('employee_assignments','pay_basis'),
                  ('attendance_records','punched_at'),
                  ('attendance_records','source'),
                  ('attendance_records','external_reference')
                )
            `);
            const column = (table, name) => columns.rows.find(row => row.table_name === table && row.column_name === name);
            assert.equal(column('client_sites','client_name')?.character_maximum_length, 160);
            assert.equal(column('employee_assignments','pay_basis')?.character_maximum_length, 20);
            assert.equal(column('attendance_records','punched_at')?.column_default, null);
            assert.equal(column('attendance_records','source')?.character_maximum_length, 16);
            assert.equal(column('attendance_records','external_reference')?.data_type, 'text');

            const fks = await client.query(`
              SELECT tc.table_name, tc.constraint_name, rc.delete_rule
              FROM information_schema.table_constraints tc
              JOIN information_schema.referential_constraints rc
                ON rc.constraint_catalog=tc.constraint_catalog
               AND rc.constraint_schema=tc.constraint_schema
               AND rc.constraint_name=tc.constraint_name
              WHERE tc.table_schema='public'
                AND tc.constraint_name IN (
                  'employee_assignments_employee_company_fk',
                  'attendance_records_employee_company_fk',
                  'attendance_records_assignment_company_fk'
                )
            `);
            const deleteRule = (table, constraint) => fks.rows.find(row => row.table_name === table && row.constraint_name === constraint)?.delete_rule;
            assert.equal(deleteRule('employee_assignments','employee_assignments_employee_company_fk'), 'CASCADE');
            assert.equal(deleteRule('attendance_records','attendance_records_employee_company_fk'), 'CASCADE');
            assert.equal(deleteRule('attendance_records','attendance_records_assignment_company_fk'), 'RESTRICT');

            const rls = await client.query(`
              SELECT relname, relrowsecurity FROM pg_class
              JOIN pg_namespace ON pg_namespace.oid=pg_class.relnamespace
              WHERE nspname='public' AND relname IN ('client_sites','employee_assignments','attendance_records')
            `);
            assert.equal(rls.rows.length, 3);
            assert.ok(rls.rows.every(row => row.relrowsecurity), 'workforce tables must have RLS enabled');
            console.log('Canonical workforce schema assertions passed.');
          } finally {
            await client.end();
          }
          NODE
      - name: Verify migrations are idempotent on the upgraded database
        working-directory: api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/omega_migration_test
        run: npm run migrate
