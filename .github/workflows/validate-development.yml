name: Validate Omega development

on:
  push:
    branches:
      - development
    paths:
      - "api/**"
      - "vite-version/**"
      - ".github/workflows/validate-development.yml"
  pull_request:
    paths:
      - "api/**"
      - "vite-version/**"
      - ".github/workflows/validate-development.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: omega_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omega_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            vite-version/package-lock.json
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Build API
        working-directory: api
        run: npm run build
      - name: Run API tests
        working-directory: api
        env:
          MFA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/omega_test
        run: npm test
      - name: Smoke-test deployed API health and database
        run: |
          curl --fail --silent --show-error --connect-timeout 5 --max-time 10 --retry 3 --retry-all-errors --retry-delay 3 \
            https://omega-solutions-api-development.onrender.com/api/health \
            --output /tmp/omega-api-health.json
          cat /tmp/omega-api-health.json
          node -e "const h=require('/tmp/omega-api-health.json'); if (h.status !== 'ok' || h.database !== 'connected') { console.error('API health check failed'); process.exit(1); }"

      - name: Install frontend dependencies
        working-directory: vite-version
        run: npm ci
      - name: Build frontend
        working-directory: vite-version
        run: npm run build

  migration-smoke:
    name: Clean PostgreSQL migration and idempotency smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: omega_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omega_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Verify mixed migration naming sorts by intended version
        working-directory: api
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; import { compareMigrationNames } from './scripts/migration-order.mjs'; assert.ok(compareMigrationNames('009_invoice_number_sequences.sql', '20261014190000_010_quotations.sql') < 0); assert.ok(compareMigrationNames('20261014190000_010_quotations.sql', '20261014190100_011_sales_orders.sql') < 0); assert.ok(compareMigrationNames('20261014190100_011_sales_orders.sql', '012_crm_full_suite.sql') < 0); assert.ok(compareMigrationNames('024_workforce_foundation.sql', '024_workforce_attendance_assignments.sql') < 0); assert.ok(compareMigrationNames('20261018000000_product_image_storage.sql', '2026101801_add_product_image_columns.sql') < 0);"
      - name: Apply all migrations to a clean disposable database
        working-directory: api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/omega_migration_test
        run: npm run migrate
      - name: Verify migrations are idempotent on the upgraded database
        working-directory: api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/omega_migration_test
        run: npm run migrate
