name: Workforce API validation

on:
  push:
    branches:
      - development
    paths:
      - "api/**"
      - ".github/workflows/workforce-validation.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/workforce-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workforce-api:
    name: API build, tests, and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            .github/workflows/workforce-validation.yml
      - name: Use npm 11.6.0 for stable peer resolution
        run: npm install --global npm@11.6.0
      - name: Install dependencies
        run: npm ci
      - name: Build API
        run: npm run build
      - name: Run unit tests
        run: npm test
      - name: Lint API
        run: npm run lint
