name: Generate safe dependency remediation locks

on:
  push:
    branches: [development]
    paths:
      - ".github/workflows/dependency-lock-remediation.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install API dependencies before remediation
        working-directory: api
        run: npm ci --no-audit --no-fund

      - name: Apply compatible API security updates
        working-directory: api
        run: npm audit fix --no-fund || true

      - name: Install frontend dependencies before remediation
        working-directory: vite-version
        run: npm ci --no-audit --no-fund

      - name: Apply compatible frontend security updates
        working-directory: vite-version
        run: npm audit fix --no-fund || true

      - name: Validate API after lockfile updates
        working-directory: api
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
          npm run lint

      - name: Validate frontend after lockfile updates
        working-directory: vite-version
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run lint

      - name: Commit validated dependency lockfile updates
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/package-lock.json vite-version/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency lockfile changes to commit."
          else
            git commit -m "chore(deps): apply validated compatible security updates"
            git push origin HEAD:development
          fi

      - name: Capture remaining dependency audit findings
        run: |
          mkdir -p dependency-audit
          (cd api && npm audit --json > ../dependency-audit/api-audit.json) || true
          (cd vite-version && npm audit --json > ../dependency-audit/frontend-audit.json) || true

      - name: Upload generated lockfiles and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-remediation
          path: |
            api/package-lock.json
            vite-version/package-lock.json
            dependency-audit/*.json
          if-no-files-found: error
          retention-days: 3
