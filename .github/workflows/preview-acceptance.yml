name: Preview ERP acceptance
run-name: Preview acceptance on ${{ github.ref_name }}

on:
  push:
    branches:
      - development
    paths:
      - "vite-version/**"
      - ".github/workflows/preview-acceptance.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # Daily at 09:00 East Africa Time

permissions:
  contents: read

concurrency:
  group: preview-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: vite-version
    env:
      CI: "true"
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_ACCEPTANCE_EMAIL: ${{ secrets.E2E_ACCEPTANCE_EMAIL }}
      E2E_ACCEPTANCE_PASSWORD: ${{ secrets.E2E_ACCEPTANCE_PASSWORD }}
      E2E_COMPANY_NAME: ${{ vars.E2E_COMPANY_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vite-version/package-lock.json
      - name: Validate Preview test configuration
        run: |
          missing=0
          for key in E2E_BASE_URL E2E_ACCEPTANCE_EMAIL E2E_ACCEPTANCE_PASSWORD; do
            if [ -z "${!key}" ]; then echo "Missing GitHub Actions secret: $key"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the dedicated non-production Preview test account and Preview URL before running this workflow."
            exit 1
          fi
          case "$E2E_BASE_URL" in
            https://*) ;;
            *) echo "E2E_BASE_URL must be an HTTPS Preview URL."; exit 1 ;;
          esac
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run read-only Preview acceptance tests
        run: npm run test:e2e:acceptance
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-acceptance-results
          path: |
            vite-version/test-results/
            vite-version/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
